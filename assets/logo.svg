<!-- 用高对比线性渐变呈现简洁的字标Logo，体现专业与现代感。 -->
<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HedgeGridX">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1220" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="640" height="180" rx="18" fill="url(#g2)"/>
  <g filter="url(#shadow)">
    <text x="40" y="110" font-family="'SF Pro Display', 'Inter', system-ui, -apple-system, Segoe UI" font-size="72" font-weight="700" fill="url(#g1)">HedgeGridX</text>
  </g>
  <g opacity="0.22">
    <path d="M40 130 L600 130" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 6"/>
    <circle cx="120" cy="130" r="3" fill="#22c55e"/>
    <circle cx="280" cy="130" r="3" fill="#0ea5e9"/>
    <circle cx="440" cy="130" r="3" fill="#6366f1"/>
  </g>
  <title>HedgeGridX - Hedged Grid Quant Engineering</title>
</svg>

